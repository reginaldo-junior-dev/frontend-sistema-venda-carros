<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Carros novos e usados com procedência. Encontre, reserve e pague online." />
    <title>Pátio · Carros novos e usados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
    />
    <script>
      // Aplica o tema antes da pintura para não piscar
      try {
        const salvo = localStorage.getItem('tema')
        const escuro = salvo ? salvo === 'escuro' : matchMedia('(prefers-color-scheme: dark)').matches
        if (escuro) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
